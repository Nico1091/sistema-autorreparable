<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - Vector Prisma</title>
    <!--Estilos para concordancia-->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="animacion_index.css">
    <link rel="stylesheet" href="Sender.css">
    <link rel="stylesheet" href="Registro_usuario.css">
    
    <!-- Font Awesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body.seccion-entrada {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f9f9f9;
        }
        
        .contenedor_ingreso {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #f0f0f0;
        }
        
        .contenedor_ingreso .logo {
            font-size: 36px;
            color: #6c5ce7;
            margin-bottom: 8px;
        }
        
        .contenedor_ingreso h2 {
            color: #2d3436;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: 500;
        }
        
        .contenedor_ingreso .chat_input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
            box-sizing: border-box;
            background: #fafafa;
            color: #2d3436;
        }
        
        .contenedor_ingreso .chat_input:focus {
            border-color: #6c5ce7;
            outline: none;
            background: #fff;
        }
        
        .contenedor_ingreso .chat_input::placeholder {
            color: #b2bec3;
        }
        
        .contenedor_ingreso .boton-ingresar {
            width: 100%;
            padding: 12px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .contenedor_ingreso .boton-ingresar:hover {
            background: #5b4cdb;
        }
        
        .contenedor_ingreso .boton-ingresar:disabled {
            background: #b2bec3;
            cursor: not-allowed;
        }
        
        .contenedor_ingreso a {
            display: block;
            text-align: center;
            font-size: 12px;
            color: #6c5ce7;
            text-decoration: none;
            margin-top: 16px;
            transition: color 0.2s;
        }
        
        .contenedor_ingreso a:hover {
            color: #5b4cdb;
        }
        
        .contenedor_ingreso .divider {
            margin: 24px 0;
            position: relative;
            text-align: center;
        }
        
        .contenedor_ingreso .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #f0f0f0;
        }
        
        .contenedor_ingreso .divider span {
            background: #fff;
            padding: 0 12px;
            color: #b2bec3;
            font-size: 11px;
            position: relative;
        }
        
        .contenedor_ingreso .mensaje-error {
            color: #d63031;
            font-size: 12px;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            background: #fff5f5;
            display: none;
        }
        
        .contenedor_ingreso .mensaje-error.visible {
            display: block;
        }
        
        .contenedor_ingreso .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Botón de Mercado fijo */
        .btn-mercado-fijo {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: #00b894;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }
        
        .btn-mercado-fijo:hover {
            background: #00a383;
            transform: scale(1.05);
        }
    </style>
</head>

<body class="seccion-entrada">
    
    <!-- Botón de mercado -->
    <button class="btn-mercado-fijo" onclick="window.location.href='mercado.html'">
        <i class="fas fa-chart-line"></i> Mercado
    </button>
    
    <!-- Botón de derecho judicial -->
    <button class="btn-mercado-fijo" style="top: 70px;" onclick="window.location.href='derechojudicial.html'">
        <i class="fas fa-gavel"></i> Derecho Judicial
    </button>
    
    <div id="sistema_operativo"></div>
    <div class="contenedor_ingreso">
        <div class="logo">
            <i class="fas fa-cube"></i>
        </div>
        <h2>Bienvenido</h2>
        
        <div id="mensaje-error" class="mensaje-error"></div>
        
        <input type="text" id="ingreso_usuario" placeholder="Usuario" class="chat_input">
        <input type="password" id="ingreso_pass" placeholder="Contraseña" class="chat_input">

        <button id="boton-ingresar" class="boton-ingresar" onclick="ejecutarIngreso()">
            <i class="fas fa-sign-in-alt"></i> <span>Ingresar</span>
        </button>

        <div class="divider">
            <span>Ó</span>
        </div>

        <a href="Registro_usuario.html">
            <i class="fas fa-user-plus"></i> Crear cuenta nueva
        </a>
        
        <a href="index.html">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    <script src="conexionbdAdominio.js"></script>
    <script>
        async function ejecutarIngreso() {
            const usuario = document.getElementById('ingreso_usuario').value.trim();
            const pass = document.getElementById('ingreso_pass').value.trim();
            const boton = document.getElementById('boton-ingresar');
            const mensajeError = document.getElementById('mensaje-error');
            
            // Resetear mensaje de error
            mensajeError.classList.remove('visible');
            mensajeError.textContent = '';
            
            if (!usuario || !pass) {
                mensajeError.textContent = 'Por favor complete todos los campos';
                mensajeError.classList.add('visible');
                return;
            }
            
            // Mostrar estado de carga
            boton.disabled = true;
            boton.innerHTML = '<span class="loading"></span> Verificando...';
            
            try {
                // Verificar credenciales usando la función de la base de datos
                const esValido = await window.verificarCredenciales(usuario, pass);
                
                if (esValido) {
                    // Actualizar UI
                    if (window.GestorConversaciones && window.GestorConversaciones.recargarParaUsuario) {
                        window.GestorConversaciones.recargarParaUsuario();
                    }
                    if (window.BarraTokens && window.BarraTokens.actualizarBotonIngreso) {
                        window.BarraTokens.actualizarBotonIngreso();
                    }
                    // Credenciales correctas - redirigir
                    window.location.href = 'index.html';
                } else {
                    // Credenciales incorrectas
                    mensajeError.textContent = 'Usuario o contraseña incorrectos';
                    mensajeError.classList.add('visible');
                }
            } catch (error) {
                console.error('Error en el login:', error);
                mensajeError.textContent = 'Error de conexión. Por favor intente más tarde.';
                mensajeError.classList.add('visible');
            } finally {
                // Restaurar botón
                boton.disabled = false;
                boton.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Ingresar</span>';
            }
        }
        
        // Permitir enter para enviar
        document.getElementById('ingreso_pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                ejecutarIngreso();
            }
        });
        
        // También permitir enter en el usuario
        document.getElementById('ingreso_usuario').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                ejecutarIngreso();
            }
        });
    </script>
</body>

</html>
