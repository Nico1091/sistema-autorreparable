<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vector Prisma</title>
    <!--Estilos para concordancia-->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="animacion_index.css">
    <link rel="stylesheet" href="Sender.css">
    <link rel="stylesheet" href="Registro_usuario.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Botón de Mercado fijo */
        .btn-mercado-fijo {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: #00b894;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
        }
        
        .btn-mercado-fijo:hover {
            background: #00a383;
            transform: scale(1.05);
        }
    </style>
    </head>

<body class="seccion-entrada">
    
    <!-- Botón de mercado -->
    <button class="btn-mercado-fijo" onclick="window.location.href='mercado.html'">
        <i class="fas fa-chart-line"></i> Mercado
    </button>
    
    <!-- Botón de derecho judicial -->
    <button class="btn-mercado-fijo" style="top: 70px;" onclick="window.location.href='derechojudicial.html'">
        <i class="fas fa-gavel"></i> Derecho Judicial
    </button>
    
    <div id="sistema_operativo"></div>
    <div class="contenedor_registro">
        <h3 style="text-align: center; color:#333">Registro de cliente </h3>    
        <input type="text" id="reg_usuario" placeholder="Nombre de Usuario" class="chat_input"> <!--Registro de usuarios-->
        <input type="email" id="reg_correo" placeholder="correo electronico" class="chat_input"> <!--Campo de correo electronico -->
        <input type="password" id="reg_pass" placeholder="Contraseña" class="chat_input">

        <button class="boton_de_chat" onclick="ejecutarRegistro()" style="width: 100%; margin: 0;">
            Registrarse
        </button>

        <a href="index.html" style="text-align: center; font-size: 0.8em; color: #666; text-decoration: none; margin-top: 10px" >
            Volver al acceso
        </a>
    </div>
    <script src="conexionbdAdominio.js"></script>
    <script src="ejecutarregistro.js"></script>
</body>

</html>
